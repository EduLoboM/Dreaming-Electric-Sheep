[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dreaming-electric-sheep"
dynamic = ["version"]
authors = [{ name = "Roberto Prevato", email = "roberto.prevato@gmail.com" }]
description = "Fast web framework for Python asyncio"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["dreaming-electric-sheep", "dreaming electric sheep", "web framework", "asyncio"]
dependencies = [
    "certifi>=2025.4.26",
    "guardpost>=1.0.4",
    "rodi~=2.0.8",
    "essentials>=1.1.8,<2.0",
    "essentials-openapi>=1.2.0,<2.0",
    "itsdangerous~=2.2.0",
    "h11>=0.14.0,<1.0.0",
    "h2>=4.0.0,<5.0.0",
    "httptools>=0.7.1",
    "msgspec>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dreaming_electric_sheep*"]

[tool.setuptools.dynamic]
version = { attr = "dreaming_electric_sheep.__version__" }

[project.optional-dependencies]
jinja = ["Jinja2~=3.1.6"]
xml = ["defusedxml>=0.7.1"]
full = [
    "cryptography>=45.0.2,<47.0.0",
    "PyJWT>=2.10.1,<2.13.0",
    "websockets~=15.0.1",
    "Jinja2~=3.1.6",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/EduLoboM/Dreaming-Electric-Sheep"
Documentation = "https://github.com/EduLoboM/Dreaming-Electric-Sheep#readme"
Issues = "https://github.com/EduLoboM/Dreaming-Electric-Sheep/issues"
Repository = "https://github.com/EduLoboM/Dreaming-Electric-Sheep"
Changelog = "https://github.com/EduLoboM/Dreaming-Electric-Sheep/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

